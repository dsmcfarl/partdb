services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: partdb
      POSTGRES_USER: partdb
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partdb -d partdb"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - partdb-data:/var/lib/postgresql/data

volumes:
  partdb-data:
